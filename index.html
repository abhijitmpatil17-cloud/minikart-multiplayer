<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>MiniKart Multiplayer</title>
<style>
body{margin:0;background:#17212b;color:white;font-family:Arial;text-align:center}
h2{margin:12px}
canvas{width:96vw;max-width:500px;background:#397d3b;border:3px solid white;border-radius:12px;touch-action:none}
button,input{font-size:17px;padding:12px;margin:5px;border:0;border-radius:10px}
button{background:#ffbd32;color:#222;font-weight:bold}
#controls{display:flex;justify-content:center;gap:15px}
#controls button{font-size:28px;width:95px}
</style>
</head>
<body>
<h2>🏎️ MiniKart Multiplayer</h2>
<input id="room" placeholder="Enter room code" maxlength="12">
<button id="join">Join Room</button>
<p id="status">Enter the same room code as your friend.</p>
<canvas id="game" width="400" height="600"></canvas>
<div id="controls">
<button id="left">⬅️</button>
<button id="boost">⚡</button>
<button id="right">➡️</button>
</div>
<p>Share your room code with friends!</p>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://diaqkfmhohihivspfdua.supabase.co";
const SUPABASE_KEY = "sb_publishable_w6Jc3sSTdIa5A3l6GgUGXw_1AbO3PuJ";

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const id = Math.random().toString(36).slice(2,9);
const colors = ["#ff3b30","#38bdf8","#facc15","#e879f9","#ffffff"];
const color = colors[Math.floor(Math.random()*colors.length)];

let car = {x:200,y:440,color};
let players = {};
let channel = null;
let room = "";
let left = false, right = false, boost = false;
let lastSend = 0;

function drawCar(a) {
  ctx.fillStyle = a.color;
  ctx.fillRect(a.x-12,a.y-20,24,40);
  ctx.fillStyle = "#bcecff";
  ctx.fillRect(a.x-8,a.y-12,16,10);
  ctx.fillStyle = "#222";
  ctx.fillRect(a.x-15,a.y-13,5,10);
  ctx.fillRect(a.x+10,a.y-13,5,10);
  ctx.fillRect(a.x-15,a.y+10,5,10);
  ctx.fillRect(a.x+10,a.y+10,5,10);
}

async function joinRoom() {
  room = document.getElementById("room").value.trim().toUpperCase();

  if (!room) {
    alert("Enter a room code first!");
    return;
  }

  if (channel) {
    await db.removeChannel(channel);
    channel = null;
  }

  players = {};
  document.getElementById("status").textContent = "Connecting to room " + room + "...";

  channel = db.channel("minikart-room-" + room, {
    config: {broadcast: {self: false}}
  });

  channel
    .on("broadcast", {event: "car"}, ({payload}) => {
      if (payload && payload.id && payload.id !== id) {
        players[payload.id] = payload;
      }
    })
    .subscribe(status => {
      if (status === "SUBSCRIBED") {
        document.getElementById("status").textContent =
          "Connected! Room: " + room + " — share this code.";
        sendCar();
      } else if (status === "CHANNEL_ERROR" || status === "TIMED_OUT") {
        document.getElementById("status").textContent =
          "Connection failed. Check your Supabase URL, key and Realtime settings.";
      }
    });
}

async function sendCar() {
  if (!channel) return;

  await channel.send({
    type: "broadcast",
    event: "car",
    payload: {
      id,
      x: car.x,
      y: car.y,
      color
    }
  });
}

document.getElementById("join").onclick = joinRoom;

function control(button, direction) {
  button.addEventListener("pointerdown", e => {
    e.preventDefault();
    if (direction === "left") left = true;
    if (direction === "right") right = true;
    if (direction === "boost") boost = true;
  });
  ["pointerup","pointercancel","pointerleave"].forEach(event => {
    button.addEventListener(event, () => {
      if (direction === "left") left = false;
      if (direction === "right") right = false;
      if (direction === "boost") boost = false;
    });
  });
}

control(document.getElementById("left"),"left");
control(document.getElementById("right"),"right");
control(document.getElementById("boost"),"boost");

function frame(time) {
  if (left) car.x -= boost ? 7 : 4;
  if (right) car.x += boost ? 7 : 4;
  car.x = Math.max(50,Math.min(350,car.x));

  ctx.clearRect(0,0,400,600);
  ctx.fillStyle = "#367c39";
  ctx.fillRect(0,0,400,600);
  ctx.fillStyle = "#555";
  ctx.fillRect(35,0,330,600);
  ctx.fillStyle = "#eee";

  for (let y=0; y<600; y+=60) {
    ctx.fillRect(195,y,10,30);
  }

  ctx.fillStyle = "#ffeb3b";
  ctx.fillRect(45,0,5,600);
  ctx.fillRect(350,0,5,600);

  for (const p of Object.values(players)) {
    drawCar(p);
  }

  drawCar(car);

  if (channel && time-lastSend > 100) {
    lastSend = time;
    sendCar();
  }

  requestAnimationFrame(frame);
}

requestAnimationFrame(frame);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>MiniKart Multiplayer</title>
<style>
body{margin:0;background:#17212b;color:white;font-family:Arial;text-align:center}
h2{margin:10px}
canvas{width:96vw;max-width:500px;background:#397d3b;border:3px solid white;border-radius:12px;touch-action:none}
button,input{font-size:18px;padding:12px;margin:5px;border:0;border-radius:10px}
button{background:#ffbd32;color:#222;font-weight:bold}
#controls{display:flex;justify-content:center;gap:35px}
#controls button{font-size:30px;width:100px}
</style>
</head>
<body>
<h2>🏎️ MiniKart Multiplayer</h2>
<input id="room" placeholder="Room code" maxlength="12">
<button onclick="joinRoom()">Join Room</button>
<p id="status">Create a room or enter a room code.</p>
<canvas id="game" width="400" height="600"></canvas>
<div id="controls">
<button ontouchstart="left=true" ontouchend="left=false" onmousedown="left=true" onmouseup="left=false">⬅️</button>
<button onclick="boost=1;setTimeout(()=>boost=0,500)">⚡</button>
<button ontouchstart="right=true" ontouchend="right=false" onmousedown="right=true" onmouseup="right=false">➡️</button>
</div>
<p>Share the same room code with your friends!</p>
<script>
const c=document.getElementById("game"),x=c.getContext("2d");
let car={x:200,y:480,color:"#ff3b30"},others={},left=false,right=false,boost=0;
let room="";const id=Math.random().toString(36).slice(2,8);
function joinRoom(){
 room=document.getElementById("room").value.trim()||Math.random().toString(36).slice(2,7).toUpperCase();
 document.getElementById("room").value=room;
 document.getElementById("status").textContent="Room: "+room+" | Share this code with friends.";
}
function drawCar(a){
 x.fillStyle=a.color;x.fillRect(a.x-12,a.y-20,24,40);
 x.fillStyle="#bcecff";x.fillRect(a.x-8,a.y-14,16,10);
 x.fillStyle="#222";x.fillRect(a.x-15,a.y-13,5,10);x.fillRect(a.x+10,a.y-13,5,10);
 x.fillRect(a.x-15,a.y+10,5,10);x.fillRect(a.x+10,a.y+10,5,10);
}
function frame(){
 if(left)car.x-=4+boost*3;if(right)car.x+=4+boost*3;
 car.x=Math.max(45,Math.min(355,car.x));
 x.clearRect(0,0,400,600);
 x.fillStyle="#367c39";x.fillRect(0,0,400,600);
 x.fillStyle="#555";x.fillRect(35,0,330,600);
 x.fillStyle="#eee";for(let y=0;y<600;y+=60)x.fillRect(195,y,10,30);
 x.fillStyle="#ffeb3b";x.fillRect(45,0,5,600);x.fillRect(350,0,5,600);
 drawCar(car);
 requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>

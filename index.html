<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>MiniKart Multiplayer</title>
<style>
body{margin:0;background:#17212b;color:white;font-family:Arial;text-align:center}
h2{margin:12px}
canvas{width:96vw;max-width:500px;background:#397d3b;border:3px solid white;border-radius:12px}
button,input{font-size:17px;padding:12px;margin:5px;border:0;border-radius:10px}
button{background:#ffbd32;color:#222;font-weight:bold}
#controls{display:flex;justify-content:center;gap:10px}
#controls button{font-size:24px;width:95px;touch-action:none}
</style>
</head>
<body>

<h2>🏎️ MiniKart Multiplayer</h2>
<input id="room" placeholder="Room code" maxlength="12">
<button id="join">Join Room</button>
<p id="status">Enter the same room code on both devices.</p>

<canvas id="game" width="400" height="600"></canvas>

<div id="controls">
<button id="left">⬅️</button>
<button id="boost">⚡ BOOST</button>
<button id="right">➡️</button>
</div>

<p>🏁 Automatic racing | 🔊 Engine sound</p>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

<script>
const SUPABASE_URL = "https://diaqkfmhohihivspfdua.supabase.co";
const SUPABASE_KEY = "sb_publishable_w6Jc3sSTdIa5A3l6GgUGXw_1AbO3PuJ";

const statusText = document.getElementById("status");

let db = null;
let channel = null;
let joined = false;
let room = "";

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const id = Math.random().toString(36).slice(2,9);
const colors = ["#38bdf8","#ff3b30","#facc15","#e879f9","#ffffff"];
const color = colors[Math.floor(Math.random()*colors.length)];

let car = {x:200,y:450,color};
let players = {};

let left=false,right=false,boost=false;
let roadOffset=0,lastSend=0;

let audio=null,osc=null,gain=null;

function startSound(){
  try {
    if(!audio){
      audio = new (window.AudioContext || window.webkitAudioContext)();
      osc = audio.createOscillator();
      gain = audio.createGain();
      osc.connect(gain);
      gain.connect(audio.destination);
      gain.gain.value=0;
      osc.start();
    }
    if(audio.state==="suspended") audio.resume();
  } catch(e){}
}

function drawCar(a){
  ctx.fillStyle="#222";
  ctx.fillRect(a.x-15,a.y-14,6,13);
  ctx.fillRect(a.x+9,a.y-14,6,13);
  ctx.fillRect(a.x-15,a.y+8,6,13);
  ctx.fillRect(a.x+9,a.y+8,6,13);

  ctx.fillStyle=a.color;
  ctx.fillRect(a.x-11,a.y-22,22,44);

  ctx.fillStyle="#bcecff";
  ctx.fillRect(a.x-7,a.y-13,14,10);
}

async function sendCar(){
  if(!channel || !joined) return;

  try{
    await channel.send({
      type:"broadcast",
      event:"car",
      payload:{
        id:id,
        x:car.x,
        y:car.y,
        color:color
      }
    });
  }catch(e){
    console.log("Send error:",e);
  }
}
let soundContext, engineOscillator, engineVolume;

function startEngineSound() {
  try {
    const Audio = window.AudioContext || window.webkitAudioContext;
    if (!Audio) return;

    if (!soundContext) {
      soundContext = new Audio();
      engineOscillator = soundContext.createOscillator();
      engineVolume = soundContext.createGain();

      engineOscillator.type = "sawtooth";
      engineOscillator.frequency.value = 110;
      engineVolume.gain.value = 0.025;

      engineOscillator.connect(engineVolume);
      engineVolume.connect(soundContext.destination);
      engineOscillator.start();
    }

    if (soundContext.state === "suspended") {
      soundContext.resume();
    }
  } catch (error) {
    console.log("Sound error:", error);
  }
}
async function joinRoom(){
  room=document.getElementById("room").value.trim().toUpperCase();

  if(!room){
    statusText.textContent="Please enter a room code.";
    return;
  }

  if(!window.supabase){
    statusText.textContent="Supabase library failed to load. Refresh the page.";
    return;
  }

  startSound();

  joined=false;
  players={};

  statusText.textContent="Connecting to "+room+"...";

  try{
    if(channel){
      const old=channel;
      channel=null;
      await db.removeChannel(old);
    }

    channel=db.channel("minikart-room-"+room,{
      config:{broadcast:{self:false}}
    });

    channel.on("broadcast",{event:"car"},({payload})=>{
      if(payload && payload.id && payload.id!==id){
        players[payload.id]={
          x:payload.x,
          y:payload.y,
          color:payload.color || "#ff3b30",
          lastSeen:Date.now()
        };
      }
    });

    channel.subscribe(async (state,error)=>{
      console.log("Room state:",state,error || "");

      if(state==="SUBSCRIBED"){
        joined=true;
        statusText.textContent="🟢 Connected! Room: "+room;
        await sendCar();
      }

      if(state==="CHANNEL_ERROR"){
        joined=false;
        statusText.textContent="Connection error. Check Supabase settings.";
      }

      if(state==="TIMED_OUT"){
        joined=false;
        statusText.textContent="Connection timed out. Check internet.";
      }

      if(state==="CLOSED"){
        joined=false;
        statusText.textContent="Room disconnected. Tap Join Room again.";
      }
    });

  }catch(e){
    joined=false;
    statusText.textContent="Error: "+e.message;
    console.log(e);
  }
}

try{
  if(window.supabase){
    db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  }else{
    statusText.textContent="Loading connection library failed. Refresh.";
  }
}catch(e){
  statusText.textContent="Setup error: "+e.message;
}

document.getElementById("join").addEventListener("click",joinRoom);

function control(name,which){
  const el=document.getElementById(name);

  el.addEventListener("pointerdown",e=>{
    e.preventDefault();
    if(which==="left")left=true;
    if(which==="right")right=true;
    if(which==="boost")boost=true;
  });

  function release(){
    if(which==="left")left=false;
    if(which==="right")right=false;
    if(which==="boost")boost=false;
  }

  el.addEventListener("pointerup",release);
  el.addEventListener("pointercancel",release);
  el.addEventListener("pointerleave",release);
}

control("left","left");
control("right","right");
control("boost","boost");

function frame(time){
  const speed=boost?8:4;
  roadOffset=(roadOffset+speed)%60;

  if(left)car.x-=boost?6:4;
  if(right)car.x+=boost?6:4;

  car.x=Math.max(55,Math.min(345,car.x));

  if(audio && osc && gain){
    osc.frequency.setTargetAtTime(boost?180:115,audio.currentTime,0.08);
    gain.gain.setTargetAtTime(joined?0.025:0,audio.currentTime,0.08);
  }

  ctx.clearRect(0,0,400,600);
  ctx.fillStyle="#267536";
  ctx.fillRect(0,0,400,600);

  ctx.fillStyle="#555";
  ctx.fillRect(35,0,330,600);

  ctx.fillStyle="#eee";
  for(let y=-60+roadOffset;y<600;y+=60){
    ctx.fillRect(195,y,10,30);
  }

  ctx.fillStyle="#ffeb3b";
  ctx.fillRect(45,0,5,600);
  ctx.fillRect(350,0,5,600);

  for(const [pid,p] of Object.entries(players)){
    if(Date.now()-p.lastSeen>5000){
      delete players[pid];
      continue;
    }
    drawCar(p);
  }

  drawCar(car);

  if(joined && time-lastSend>150){
    lastSend=time;
    sendCar();
  }

  requestAnimationFrame(frame);
}

requestAnimationFrame(frame);
</script>
</body>
</html>
